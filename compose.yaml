services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blab_crm
      POSTGRES_USER: blab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD em .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - blab-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blab -d blab_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  blab-postgres:
